# Guards repository hygiene and the packaging invariants, not correctness.
#
# What this does NOT do, deliberately:
#   - It does not run the test suite. Most of it needs a CUDA device and hosted
#     runners have none, so a green badge here means the repository would ship
#     the right files, not that ARGUS works. The full suite runs locally and its
#     result is recorded in the release notes.
#   - It does not build the sdist. Building runs setup.py, and torch's
#     CUDAExtension resolves CUDA library paths while it is being constructed,
#     so even a build that compiles nothing needs CUDA_HOME. Installing a CUDA
#     torch just to produce a tarball would cost gigabytes per push, so sdist
#     and twine checks stay local and the packaging rule is asserted directly
#     instead: test_only_argus_cache_is_packaged fails if any directory beside
#     argus_cache/ would become a top-level package, which is exactly the defect
#     that shipped in 0.5.0 and 0.5.1.
#
# Nothing here needs torch, so the job finishes in seconds.
name: packaging

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install check tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow setuptools

      # One hygiene test imports the attention wrapper, which reaches
      # argus_cpp_backend, and nothing here compiles that extension. It guards a
      # past regression rather than packaging, so it is deselected here and runs
      # in the local suite that gates every release.
      - name: Packaging invariants and repository hygiene
        run: |
          pytest -q tests/test_import_hygiene.py tests/test_ui_mate_workload.py \
            --deselect tests/test_import_hygiene.py::test_canonical_wrapper_keeps_the_arguments_the_copy_dropped
