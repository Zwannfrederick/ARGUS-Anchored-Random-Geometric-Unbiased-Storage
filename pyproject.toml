[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus_cache"
version = "0.7.0"
description = "Paged KV-cache memory manager for LLM runtimes: GPU/pinned/RAM/disk tiers for llama.cpp with exact CUDA attention, plus a quantized-tier research path for HuggingFace"
readme = "README.md"
authors = [
    { name = "Muhammed Emin Çelik" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware :: Symmetric Multi-processing",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
]
keywords = [
    "kv-cache", "quantization", "transformers", "llm-inference",
    "paged-attention", "memory-management", "cuda", "vram",
]

requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "triton>=2.0.0",
    "transformers>=4.38.0",
]

# matplotlib and pytest were runtime dependencies through 0.3.0, but nothing
# under argus_cache/ imports either one; they only serve the benchmarks and the
# test suite. httpx is genuinely imported, but only by the optional Anthropic
# gateway adapter, so it stays out of the base install too.
[project.optional-dependencies]
gateway = ["httpx"]
dev = ["pytest", "matplotlib", "httpx"]

[project.urls]
Homepage = "https://github.com/Zwannfrederick/ARGUS-Anchored-Random-Geometric-Unbiased-Storage"
Repository = "https://github.com/Zwannfrederick/ARGUS-Anchored-Random-Geometric-Unbiased-Storage"
Changelog = "https://github.com/Zwannfrederick/ARGUS-Anchored-Random-Geometric-Unbiased-Storage/blob/main/CHANGELOG.md"
Issues = "https://github.com/Zwannfrederick/ARGUS-Anchored-Random-Geometric-Unbiased-Storage/issues"

[tool.pytest.ini_options]
# scratch/ holds throwaway experiment scripts, several named test_*.py. They
# are manual scripts, not tests; collecting them would inflate the suite's pass
# count with code nobody maintains.
norecursedirs = ["scratch", "build", "dist", ".venv", "*.egg-info"]
testpaths = ["tests"]
